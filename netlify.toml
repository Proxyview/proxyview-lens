# There is no build step.
#
# index.html is the complete document — doctype, head, encoding, viewport,
# favicon and all. Netlify publishes the repository root as it stands, so what
# is committed is exactly what a browser receives.
#
# This used to declare `command = "node tools/build-site.mjs"` and publish a
# generated dist/ directory. That failed in the only way that leaves no trace
# on the site: the deploy pushed index.html but not the script, the build
# errored, Netlify kept the last deploy that succeeded, and the site went on
# serving a months-old page while every push looked like it had worked.
[build]
  publish = "."

# The document itself must never be served from cache, or a client keeps
# seeing yesterday's build after a deploy. Everything else may cache.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# There is deliberately no host-to-host redirect here.
#
# A forced 301 in this file fires whether or not its destination exists. Today
# lens.getproxyview.com resolves and www.lens.getproxyview.com does not, so a
# rule sending the bare host to the www one would take the whole site down the
# moment it deployed: the only address that works would redirect to an address
# that does not.
#
# Canonicalisation belongs in Netlify's own Domain management instead. Set the
# primary domain there and Netlify redirects every other attached alias to it,
# and it can only ever point at a domain attached to the site, so it cannot
# strand the site the way a hand-written rule can.
